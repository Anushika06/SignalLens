# Optional: a local PostgreSQL (with pgvector available for later) for machines without one.
# Usage:  docker compose up -d db
# Then set SL_DATABASE_URL=postgresql+asyncpg://signallens:signallens@127.0.0.1:5433/signallens
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: signallens
      POSTGRES_PASSWORD: signallens
      POSTGRES_DB: signallens
    ports:
      - "5433:5432"
    volumes:
      - signallens-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signallens"]
      interval: 5s
      retries: 10
volumes:
  signallens-db:
