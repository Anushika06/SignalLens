# Builds backend/Dockerfile and publishes the public image the aiKart manifest points at
# (ghcr.io/<owner>/signallens-agent). The same image serves the hosted API (default CMD).
#
# Repository variable SL_REMOTE_AGENT_URL (Settings -> Variables) is baked into the image so
# the aiKart container, which has no API keys, delegates briefs to the hosted SignalLens API.
name: docker-publish

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/docker-publish.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry paths must be lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/signallens-agent" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: |
            SL_REMOTE_AGENT_URL=${{ vars.SL_REMOTE_AGENT_URL }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:1.0.0
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=SignalLens market and competitor intelligence agent
          cache-from: type=gha
          cache-to: type=gha,mode=max
