name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: signallens
          POSTGRES_PASSWORD: signallens
          POSTGRES_DB: signallens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signallens -d signallens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SL_TEST_DATABASE_URL: postgresql+asyncpg://signallens:signallens@127.0.0.1:5432/signallens_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check signallens tests

      - name: Test (pytest)
        run: uv run pytest -q

  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Starts the mock API and a production build of the app pointed at it. That build goes to
      # .next-e2e (the /api rewrite is fixed at build time), separate from the build above.
      - name: End-to-end tests (Playwright, mock API)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node-${{ matrix.node }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  docker:
    name: Backend Docker image (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check for a Dockerfile
        id: dockerfile
        run: |
          if [ -f backend/Dockerfile ]; then
            echo "Building backend/Dockerfile."
          else
            echo "::notice::backend/Dockerfile does not exist yet; skipping the image build."
          fi

      - name: Set up Docker Buildx
        if: hashFiles('backend/Dockerfile') != ''
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        if: hashFiles('backend/Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: signallens-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
